<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00D4AA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Outer Cybernetic Circuit Ring -->
  <circle cx="32" cy="32" r="22" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Inner Icosahedral Crest Shape -->
  <path d="M32 14 L48 24 L48 40 L32 50 L16 40 L16 24 Z" 
        stroke="url(#cyanGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        fill="#081A36" 
        fill-opacity="0.7"
        filter="url(#glow)" />

  <!-- Verification Check / Diamond Geometry -->
  <path d="M32 20 L42 32 L32 44 L22 32 Z" 
        stroke="#38BDF8" 
        stroke-width="1.5" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Center Core Star Spark -->
  <circle cx="32" cy="32" r="3" fill="#00F0FF" />
  <line x1="32" y1="26" x2="32" y2="38" stroke="#FFFFFF" stroke-width="1" />
  <line x1="26" y1="32" x2="38" y2="32" stroke="#FFFFFF" stroke-width="1" />
</svg>
